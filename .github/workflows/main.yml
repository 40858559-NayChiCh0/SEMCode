
name: Lab 07 - Integration Testing and Code Coverage

on:
  push:
    branches:
      - master
      - develop
      - lab07
  pull_request:

jobs:

  # ==========================================
  # JOB 1: UNIT TESTS
  # ==========================================
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn -B -Dtest=com.napier.AppTest test

  # ==========================================
  # JOB 2: INTEGRATION TESTS AND CODE COVERAGE
  # ==========================================
  IntegrationTests:
    name: Integration Tests and Code Coverage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build MySQL Database Image
        run: docker build -t database ./db

      - name: Start MySQL Database
        run: |
          docker run -d \
            --name employees \
            -p 33060:3306 \
            database

      - name: Wait for Employees Database
        run: |
          for i in $(seq 1 60); do
            if docker exec employees \
              mysql -uroot -pexample \
              -e "SELECT COUNT(*) FROM employees.employees;" \
              >/dev/null 2>&1; then

              echo "Employees database is ready"
              exit 0
            fi

            echo "Waiting for Employees database..."
            sleep 2
          done

          echo "Database failed to initialize"
          docker logs employees
          exit 1

      - name: Run Integration Tests and Generate Coverage
        run: |
          mvn -B -Dtest=com.napier.AppIntegrationTest verify

      - name: Verify JaCoCo Coverage Report
        run: |
          test -f target/site/jacoco/jacoco.xml
          echo "JaCoCo XML coverage report exists"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
          verbose: true

      - name: Stop and Remove Database
        if: always()
        run: |
          docker rm -f employees || true

  # ==========================================
  # JOB 3: BUILD AND RUN DOCKER COMPOSE
  # ==========================================
  build:
    name: Build and Start Using Docker Compose
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package Application
        run: mvn -B package -DskipTests

      - name: Verify Executable JAR
        run: |
          test -f target/devops.jar
          echo "Executable JAR created successfully"

      - name: Build and Run Docker Compose
        run: |
          docker compose up \
            --build \
            --abort-on-container-exit \
            --exit-code-from app

      - name: Clean Up Docker Containers
        if: always()
        run: docker compose down
