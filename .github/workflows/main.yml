name: SemCode action
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Network and Database
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods mongo

      - name: Build Application with Maven
        run: mvn clean package

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run Container
        run: docker run --network se-methods --name devopscontainer devopsimage

      - name: View Container Logs
        run: docker logs devopscontainer